# Local MySQL for development: docker compose -f infra/docker/docker-compose.yml up -d
# DATABASE_URL=mysql://enrich:enrich@127.0.0.1:3306/enrich
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: enrich
      MYSQL_USER: enrich
      MYSQL_PASSWORD: enrich
      MYSQL_DATABASE: enrich
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - enrich-mysql:/var/lib/mysql
volumes:
  enrich-mysql:
